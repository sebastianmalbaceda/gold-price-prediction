# ============================================================
# docker-compose.yml - Gold Price Prediction API
# ============================================================
services:
  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Los artefactos se regeneran fuera de la imagen y se montan en solo lectura.
      - ./models:/app/models:ro
      - ./configs:/app/configs:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
