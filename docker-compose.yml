# ============================================================
# docker-compose.yml - Gold Price Prediction API
# ============================================================
services:
  api:
    build: .
    ports:
      # Por defecto solo escucha en loopback; la exposición pública exige un proxy autenticado.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      GOLD_API_KEY: ${GOLD_API_KEY:-}
      API_MAX_BODY_BYTES: ${API_MAX_BODY_BYTES:-131072}
    volumes:
      # Los artefactos se regeneran fuera de la imagen y se montan en solo lectura.
      - ./models:/app/models:ro
      - ./configs:/app/configs:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
