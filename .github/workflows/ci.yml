# ============================================================
# GitHub Actions - CI
# ============================================================
name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Tests unitarios y validacion de notebooks
        # Sin -q se registra el numero de tests ejecutados: un fichero de tests
        # que deje de recolectarse pasaria inadvertido con la salida silenciosa.
        run: python -m pytest tests/ -v --durations=10

      - name: Verificar sintaxis de fuentes
        run: python -m compileall -q src scripts tests

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar linters
        run: python -m pip install --upgrade pip flake8 black isort
      - name: Flake8 (src, scripts, tests)
        run: python -m flake8 src scripts tests --max-line-length=100 --extend-ignore=E203,W503
      - name: Black check
        run: python -m black --check --line-length 100 --skip-string-normalization --target-version py311 src scripts tests
      - name: Isort check
        # El pre-commit ya ordena los imports; sin este paso el CI aceptaba
        # ramas cuyos autores no tuviesen los hooks instalados.
        run: python -m isort --check-only --profile black --line-length 100 src scripts tests

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar herramientas de seguridad
        run: python -m pip install --upgrade pip bandit pip-audit
      - name: Bandit (analisis estatico de seguridad)
        # -ll limita el reporte a severidad media/alta para no bloquear por avisos
        # informativos, pero cualquier hallazgo real detiene el pipeline.
        run: python -m bandit -ll -r src scripts
      - name: pip-audit (vulnerabilidades conocidas en dependencias)
        # No bloquea el build: la base de vulnerabilidades cambia a diario y un
        # CVE nuevo en una transitiva no debe impedir un merge urgente, pero
        # queda registrado en el log para su revision.
        continue-on-error: true
        run: python -m pip_audit -r requirements.txt --strict
