# ============================================================
# GitHub Actions - CI
# ============================================================
name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Tests unitarios y validacion de notebooks
        run: python -m pytest tests/ -q

      - name: Verificar sintaxis de fuentes
        run: python -m compileall -q src scripts tests

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar linters
        run: python -m pip install --upgrade pip flake8 black
      - name: Flake8 (src, scripts, tests)
        run: python -m flake8 src scripts tests --max-line-length=100 --extend-ignore=E203,W503
      - name: Black check
        run: python -m black --check --line-length 100 --skip-string-normalization --target-version py311 src scripts tests
