[pytest]
testpaths = tests
# --strict-markers convierte un marcador mal escrito en error en lugar de un
# aviso silencioso que dejaria el test sin ejecutar el filtro esperado.
# --strict-config hace lo mismo con las claves de esta seccion.
addopts = -q --strict-markers --strict-config
filterwarnings =
    # Las advertencias del codigo del proyecto deben fallar el build: una
    # FutureWarning de pandas o una DeprecationWarning de scikit-learn silenciada
    # es exactamente el tipo de aviso que rompe el pipeline en la siguiente
    # actualizacion de dependencias.
    error::FutureWarning:src.*
    error::DeprecationWarning:src.*
    # Ruido de terceros que no depende de este repositorio.
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:httpx.*
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*
markers =
    slow: pruebas que tardan mas de unos segundos
