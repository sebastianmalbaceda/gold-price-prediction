[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-price-prediction"
version = "1.0.0"
description = "Predicción del precio spot del oro (USD/oz) a 1/5/21 días hábiles mediante ML"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Gold Price Prediction Team" }]
keywords = ["forecasting", "time-series", "gold", "machine-learning", "finance"]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "optuna>=4.0.0",
    "shap>=0.46.0",
    "pyyaml>=6.0",
    "joblib>=1.4.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "jupyterlab>=4.0.0",
    "nbformat>=5.9.0",
    "ipykernel>=6.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
]
dl = [
    "torch>=2.2.0,<3.0.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
